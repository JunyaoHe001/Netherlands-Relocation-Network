name: Publish interactive atlas

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-atlas.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-interactive-atlas
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download and verify the atlas archive
        env:
          ATLAS_URL: https://drive.google.com/uc?export=download&id=1JezKUy4vt5CUjEw8YRiU6ktwIoo0JgLQ
          ATLAS_SHA256: cc43ce78177de74a7a4f765ee88284d553b364e0a8f8bcd8a03b6ff9a46b0892
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/atlas_site_bundle.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors "$ATLAS_URL" --output "$archive"
          echo "$ATLAS_SHA256  $archive" | sha256sum --check --strict

      - name: Install the atlas under the project website
        run: |
          set -euo pipefail
          rm -rf atlas
          mkdir -p atlas
          tar -xJf "$RUNNER_TEMP/atlas_site_bundle.tar.xz" -C atlas
          touch .nojekyll
          test -f atlas/index.html
          test -f atlas/data/meta.json
          test -f atlas/data/municipalities.geojson

      - name: Commit the published website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all atlas .nojekyll
          if git diff --cached --quiet; then
            echo "The published atlas is already current."
            exit 0
          fi
          git commit -m "Publish interactive stratified relocation atlas"
          git push origin HEAD:gh-pages
