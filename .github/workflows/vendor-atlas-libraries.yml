name: Vendor atlas interface libraries

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-atlas-libraries.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-atlas-interface-libraries
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Node for exact npm package downloads
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Copy pinned Leaflet and noUiSlider assets into the site
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/atlas-vendor"
          rm -rf "$work"
          mkdir -p "$work/leaflet" "$work/nouislider"

          pushd "$work/leaflet" >/dev/null
          leaflet_archive="$(npm pack leaflet@1.9.4 --silent)"
          mkdir package-files
          tar -xzf "$leaflet_archive" -C package-files
          popd >/dev/null

          pushd "$work/nouislider" >/dev/null
          nouislider_archive="$(npm pack nouislider@15.7.1 --silent)"
          mkdir package-files
          tar -xzf "$nouislider_archive" -C package-files
          popd >/dev/null

          mkdir -p atlas/vendor/leaflet atlas/vendor/nouislider
          install -m 0644 "$work/leaflet/package-files/package/dist/leaflet.js" atlas/vendor/leaflet/leaflet.js
          install -m 0644 "$work/leaflet/package-files/package/dist/leaflet.css" atlas/vendor/leaflet/leaflet.css
          install -m 0644 "$work/nouislider/package-files/package/dist/nouislider.min.js" atlas/vendor/nouislider/nouislider.min.js
          install -m 0644 "$work/nouislider/package-files/package/dist/nouislider.min.css" atlas/vendor/nouislider/nouislider.min.css

          test "$(wc -c < atlas/vendor/leaflet/leaflet.js)" -gt 100000
          test "$(wc -c < atlas/vendor/leaflet/leaflet.css)" -gt 10000
          test "$(wc -c < atlas/vendor/nouislider/nouislider.min.js)" -gt 20000
          test "$(wc -c < atlas/vendor/nouislider/nouislider.min.css)" -gt 3000

      - name: Replace runtime CDN references with local assets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("atlas/index.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '  <link rel="preconnect" href="https://cdn.jsdelivr.net" />\n': '',
              'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css': './vendor/leaflet/leaflet.css',
              'https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css': './vendor/nouislider/nouislider.min.css',
              'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js': './vendor/leaflet/leaflet.js',
              'https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js': './vendor/nouislider/nouislider.min.js',
              'Leaflet or noUiSlider failed to load from the CDN.': 'The atlas interface libraries did not load correctly. Please retry once or report the issue.',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected atlas reference not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate the standalone atlas package
        shell: bash
        run: |
          set -euo pipefail
          grep -q './vendor/leaflet/leaflet.css' atlas/index.html
          grep -q './vendor/leaflet/leaflet.js' atlas/index.html
          grep -q './vendor/nouislider/nouislider.min.css' atlas/index.html
          grep -q './vendor/nouislider/nouislider.min.js' atlas/index.html
          if grep -q 'cdn.jsdelivr.net/npm/leaflet\|cdn.jsdelivr.net/npm/nouislider' atlas/index.html; then
            echo 'Runtime CDN reference remains in atlas/index.html' >&2
            exit 1
          fi
          node --check atlas/vendor/leaflet/leaflet.js
          node --check atlas/vendor/nouislider/nouislider.min.js
          test -f atlas/data/meta.json
          test -f atlas/data/municipalities.geojson

      - name: Commit the self-contained atlas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/index.html atlas/vendor
          if git diff --cached --quiet; then
            echo "Atlas libraries are already vendored."
            exit 0
          fi
          git commit -m "Make atlas interface libraries self-contained"
          git push origin HEAD:gh-pages
