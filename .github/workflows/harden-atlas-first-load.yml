name: Harden atlas first load

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-atlas-first-load.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-atlas-first-load
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Add retry, timeout, caching, and parallel bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("atlas/index.html")
          text = path.read_text(encoding="utf-8")

          fetch_start = text.index("    async function fetchJSON(url) {")
          fetch_end = text.index("\n\n    function getDimensionMeta", fetch_start)
          new_fetch = "\n".join([
              "    function wait(milliseconds) {",
              "      return new Promise((resolve) => setTimeout(resolve, milliseconds));",
              "    }",
              "",
              "    async function fetchJSON(url, options = {}) {",
              "      const attempts = Number(options.attempts ?? 3);",
              "      const timeoutMs = Number(options.timeoutMs ?? 15000);",
              "      let lastError = null;",
              "",
              "      for (let attempt = 0; attempt < attempts; attempt += 1) {",
              "        const controller = new AbortController();",
              "        const timeout = window.setTimeout(() => controller.abort(), timeoutMs);",
              "        try {",
              "          const response = await fetch(url, {",
              "            cache: attempt === 0 ? \"default\" : \"reload\",",
              "            signal: controller.signal,",
              "          });",
              "          if (!response.ok) {",
              "            throw new Error(`Could not load ${url}: HTTP ${response.status}`);",
              "          }",
              "          return await response.json();",
              "        } catch (error) {",
              "          lastError = error;",
              "          if (attempt + 1 < attempts) {",
              "            setLoading(true, `Connection interrupted. Retrying ${url.split(\"/\").pop()}…`);",
              "            await wait(450 * (attempt + 1));",
              "          }",
              "        } finally {",
              "          window.clearTimeout(timeout);",
              "        }",
              "      }",
              "",
              "      const reason = lastError?.name === \"AbortError\"",
              "        ? `Timed out while loading ${url}`",
              "        : (lastError?.message || String(lastError));",
              "      throw new Error(reason);",
              "    }",
          ])
          text = text[:fetch_start] + new_fetch + text[fetch_end:]

          init_start = text.index("    async function initialise() {")
          init_end = text.index("\n  </script>", init_start)
          new_initialise = "\n".join([
              "    const INITIAL_RETRY_KEY = \"atlas-initialisation-retry-v2\";",
              "",
              "    async function initialise() {",
              "      if (typeof L === \"undefined\" || typeof noUiSlider === \"undefined\") {",
              "        throw new Error(\"The atlas interface libraries did not load correctly.\");",
              "      }",
              "",
              "      setLoading(true, \"Loading atlas metadata…\");",
              "      meta = await fetchJSON(META_URL);",
              "      const defaultDimension = getDimensionMeta(meta.defaultDimension);",
              "      if (!defaultDimension) {",
              "        throw new Error(`Unknown default dimension: ${meta.defaultDimension}`);",
              "      }",
              "",
              "      setLoading(true, `Loading map and ${defaultDimension.label} layer…`);",
              "      const [geojson, nodes, edges] = await Promise.all([",
              "        fetchJSON(\"./data/municipalities.geojson\"),",
              "        fetchJSON(`./${defaultDimension.nodeFile}`),",
              "        fetchJSON(`./${defaultDimension.edgeFile}`),",
              "      ]);",
              "",
              "      municipalityGeoJSON = geojson;",
              "      dataCache.set(meta.defaultDimension, { nodes, edges });",
              "      buildMap();",
              "      buildStaticControls();",
              "      await loadDimension(meta.defaultDimension);",
              "      sessionStorage.removeItem(INITIAL_RETRY_KEY);",
              "    }",
              "",
              "    async function startAtlas() {",
              "      try {",
              "        await initialise();",
              "      } catch (error) {",
              "        const alreadyRetried = sessionStorage.getItem(INITIAL_RETRY_KEY) === \"1\";",
              "        if (!alreadyRetried) {",
              "          sessionStorage.setItem(INITIAL_RETRY_KEY, \"1\");",
              "          setLoading(true, \"Initial connection was interrupted. Retrying automatically…\");",
              "          await wait(650);",
              "          const retryUrl = new URL(window.location.href);",
              "          retryUrl.searchParams.set(\"atlas_retry\", Date.now().toString());",
              "          window.location.replace(retryUrl.toString());",
              "          return;",
              "        }",
              "        sessionStorage.removeItem(INITIAL_RETRY_KEY);",
              "        showError(error);",
              "      }",
              "    }",
              "",
              "    startAtlas();",
          ])
          text = text[:init_start] + new_initialise + text[init_end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate patched atlas
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'atlas-initialisation-retry-v2' atlas/index.html
          grep -q 'Initial connection was interrupted. Retrying automatically' atlas/index.html
          grep -q 'cache: attempt === 0 ? "default" : "reload"' atlas/index.html
          grep -q 'dataCache.set(meta.defaultDimension, { nodes, edges })' atlas/index.html
          grep -q './vendor/leaflet/leaflet.js' atlas/index.html
          grep -q './vendor/nouislider/nouislider.min.js' atlas/index.html
          test -f atlas/data/meta.json
          test -f atlas/data/municipalities.geojson

      - name: Commit hardened atlas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/index.html
          git commit -m "Harden atlas first-load initialization"
          git push origin HEAD:gh-pages
